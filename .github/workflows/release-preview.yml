name: EAS Cloud Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile (configured in eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Standalone Artifact (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔨 Execute EAS Build
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ ERROR: EXPO_TOKEN secret is not configured in this repository."
            echo "Add your Expo Access Token under Settings > Secrets and variables > Actions > EXPO_TOKEN."
            exit 1
          fi
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
